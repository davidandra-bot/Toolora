<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Toolora | Free Secure Password Generator</title>
    <meta name="description" content="Generate strong, secure passwords instantly. Customizable length and character options. 100% free and private.">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <span class="logo-icon">T</span>
                <span>Toolora</span>
            </a>
            <nav>
                <a href="../index.html">Home</a>
                <a href="../index.html#tools">Tools</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="tool-page">
        <a href="../index.html" class="btn btn-outline" style="width:auto;padding:10px 20px;">← Back</a>
        
        <h1 style="margin-top:20px;">🔐 Password Generator</h1>
        <p>Generate strong, secure passwords instantly</p>

        <div class="result-box" id="passwordResult" style="font-size:24px;text-align:center;font-family:monospace;padding:30px;">
            Click Generate
        </div>

        <button class="btn" onclick="generatePassword()">Generate Password</button>
        <button class="btn btn-outline" onclick="copyPassword()">Copy Password</button>

        <div style="margin-top:20px;">
            <label>Password Length: <strong id="lengthVal">16</strong></label>
            <input type="range" min="4" max="64" value="16" oninput="document.getElementById('lengthVal').textContent=this.value;generatePassword();">
        </div>

        <div class="grid-2" style="margin-top:15px;">
            <label><input type="checkbox" id="useUpper" checked style="width:auto;margin-right:5px;" onchange="generatePassword()">Uppercase</label>
            <label><input type="checkbox" id="useLower" checked style="width:auto;margin-right:5px;" onchange="generatePassword()">Lowercase</label>
            <label><input type="checkbox" id="useNumbers" checked style="width:auto;margin-right:5px;" onchange="generatePassword()">Numbers</label>
            <label><input type="checkbox" id="useSymbols" checked style="width:auto;margin-right:5px;" onchange="generatePassword()">Symbols</label>
        </div>

        <div style="margin-top:20px;">
            <h3>Password Strength</h3>
            <div class="progress-bar"><div class="progress-fill" id="strengthBar" style="width:0%;"></div></div>
            <p id="strengthText" style="text-align:center;font-weight:600;"></p>
        </div>
    </div>

    <div class="ad-banner container">
        <p class="ad-label">Advertisement</p>
        <script type="text/javascript">
            atOptions = {'key' : 'ecfd53d8dd228d934242cb9d2ca7cef9','format' : 'iframe','height' : 90,'width' : 728,'params' : {}};
        </script>
        <script type="text/javascript" src="https://guyprior.com/ecfd53d8dd228d934242cb9d2ca7cef9/invoke.js"></script>
    </div>

    <script>
        function generatePassword() {
            const length = parseInt(document.getElementById('lengthVal').textContent);
            const upper = document.getElementById('useUpper').checked;
            const lower = document.getElementById('useLower').checked;
            const nums = document.getElementById('useNumbers').checked;
            const syms = document.getElementById('useSymbols').checked;
            
            let chars = '';
            if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (nums) chars += '0123456789';
            if (syms) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            if (!chars) return;
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars[Math.floor(Math.random() * chars.length)];
            }
            
            document.getElementById('passwordResult').textContent = password;
            updateStrength(password);
        }

        function updateStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (password.length >= 16) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const percent = (strength / 6) * 100;
            document.getElementById('strengthBar').style.width = percent + '%';
            
            const text = document.getElementById('strengthText');
            if (strength <= 2) { text.textContent = 'Weak'; text.style.color = '#EF4444'; }
            else if (strength <= 4) { text.textContent = 'Medium'; text.style.color = '#F59E0B'; }
            else { text.textContent = 'Strong'; text.style.color = '#10B981'; }
        }

        function copyPassword() {
            const pwd = document.getElementById('passwordResult').textContent;
            if (pwd !== 'Click Generate') {
                navigator.clipboard.writeText(pwd);
                alert('Password copied!');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }

        // Generate on load
        generatePassword();
    </script>
</body>
</html>
