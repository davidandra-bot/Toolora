<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter - Toolora | Free Text Case Converter</title>
    <meta name="description" content="Convert text between UPPERCASE, lowercase, Title Case, camelCase, and more. Free online case converter.">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <span class="logo-icon">T</span>
                <span>Toolora</span>
            </a>
            <nav>
                <a href="../index.html">Home</a>
                <a href="../index.html#tools">Tools</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="tool-page">
        <a href="../index.html" class="btn btn-outline" style="width:auto;padding:10px 20px;">← Back</a>
        
        <h1 style="margin-top:20px;">🔤 Case Converter</h1>
        <p>Convert text between different cases</p>

        <textarea id="caseInput" placeholder="Type or paste text here..." style="min-height:200px;"></textarea>

        <div class="grid-2" style="margin:15px 0;">
            <button class="btn" onclick="convertCase('upper')">UPPERCASE</button>
            <button class="btn" onclick="convertCase('lower')">lowercase</button>
            <button class="btn" onclick="convertCase('title')">Title Case</button>
            <button class="btn" onclick="convertCase('sentence')">Sentence case</button>
            <button class="btn" onclick="convertCase('camel')">camelCase</button>
            <button class="btn" onclick="convertCase('pascal')">PascalCase</button>
            <button class="btn" onclick="convertCase('snake')">snake_case</button>
            <button class="btn" onclick="convertCase('kebab')">kebab-case</button>
        </div>

        <textarea id="caseOutput" placeholder="Result will appear here..." readonly></textarea>
        <button class="btn btn-outline" onclick="copyResult()">Copy Result</button>
    </div>

    <script>
        function convertCase(type) {
            const input = document.getElementById('caseInput').value;
            if (!input) { alert('Enter text first'); return; }
            
            let result = '';
            switch(type) {
                case 'upper': result = input.toUpperCase(); break;
                case 'lower': result = input.toLowerCase(); break;
                case 'title': result = input.toLowerCase().replace(/(^|\s)\w/g, function(l) { return l.toUpperCase(); }); break;
                case 'sentence': result = input.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, function(l) { return l.toUpperCase(); }); break;
                case 'camel': result = input.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, function(_, c) { return c.toUpperCase(); }); break;
                case 'pascal': result = input.toLowerCase().replace(/(^|[^a-zA-Z0-9]+)(.)/g, function(_, sep, c) { return c.toUpperCase(); }); break;
                case 'snake': result = input.toLowerCase().replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, ''); break;
                case 'kebab': result = input.toLowerCase().replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, ''); break;
            }
            
            document.getElementById('caseOutput').value = result;
        }

        function copyResult() {
            const output = document.getElementById('caseOutput').value;
            if (output) {
                navigator.clipboard.writeText(output);
                alert('Copied!');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
