<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Compress - Toolora | Free Online PDF Compressor</title>
    <meta name="description" content="Compress PDF files online for free. Reduce PDF file size instantly in your browser.">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <span class="logo-icon">T</span>
                <span>Toolora</span>
            </a>
            <nav>
                <a href="../index.html">Home</a>
                <a href="../index.html#tools">Tools</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="tool-page">
        <a href="../index.html" class="btn btn-outline" style="width:auto;padding:10px 20px;">← Back</a>
        
        <h1 style="margin-top:20px;">📦 PDF Compress</h1>
        <p>Reduce PDF file size</p>

        <div class="upload-area" onclick="document.getElementById('pdfInput').click()">
            <div class="icon">📄</div>
            <h3>Click to select PDF</h3>
            <input type="file" id="pdfInput" accept=".pdf" style="display:none;" onchange="handlePDF(this.files[0])">
        </div>

        <div id="pdfInfo" style="display:none;"></div>
        <button class="btn" onclick="compressPDF()" style="display:none;" id="compressBtn">Compress PDF</button>
        <div class="result-box" id="compressResult" style="display:none;"></div>
    </div>

    <script>
        let selectedFile = null;

        function handlePDF(file) {
            if (!file) return;
            selectedFile = file;
            document.getElementById('pdfInfo').style.display = 'block';
            document.getElementById('pdfInfo').innerHTML = '<p>📄 ' + file.name + ' (' + (file.size/1024).toFixed(2) + ' KB)</p>';
            document.getElementById('compressBtn').style.display = 'block';
        }

        function compressPDF() {
            if (!selectedFile) return;
            document.getElementById('compressResult').style.display = 'block';
            document.getElementById('compressResult').innerHTML = '⚠️ PDF compression requires server-side processing. This is a demo version.';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
