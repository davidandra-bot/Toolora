<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to JPG - Toolora | Free PDF to Image Converter</title>
    <meta name="description" content="Convert PDF pages to JPG images. Free online PDF to image converter.">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <span class="logo-icon">T</span>
                <span>Toolora</span>
            </a>
            <nav>
                <a href="../index.html">Home</a>
                <a href="../index.html#tools">Tools</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="tool-page">
        <a href="../index.html" class="btn btn-outline" style="width:auto;padding:10px 20px;">← Back</a>
        
        <h1 style="margin-top:20px;">🖼️ PDF to JPG</h1>
        <p>Convert PDF pages to images</p>

        <div class="upload-area" onclick="document.getElementById('pdfInput').click()">
            <div class="icon">📄</div>
            <h3>Click to select PDF</h3>
            <input type="file" id="pdfInput" accept=".pdf" style="display:none;" onchange="handlePDF(this.files[0])">
        </div>

        <div id="pdfInfo" style="display:none;"></div>
        <div class="result-box" id="convertResult" style="display:none;"></div>
    </div>

    <script>
        function handlePDF(file) {
            if (!file) return;
            document.getElementById('pdfInfo').style.display = 'block';
            document.getElementById('pdfInfo').innerHTML = '<p>📄 ' + file.name + '</p>';
            document.getElementById('convertResult').style.display = 'block';
            document.getElementById('convertResult').innerHTML = '⚠️ PDF to JPG conversion requires PDF.js library integration.';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
