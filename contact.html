<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Toolora - Free Online Tools</title>
    <meta name="description" content="Contact the Toolora team. We'd love to hear from you.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">T</span>
                <span>Toolora</span>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="index.html#tools">Tools</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <div class="tool-page">
        <h1>Contact Us</h1>
        <p>Have a question, suggestion, or feedback? We'd love to hear from you!</p>
        
        <label>Your Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        
        <label>Message</label>
        <textarea id="message" placeholder="Your message..." style="min-height:150px;"></textarea>
        
        <button class="btn" onclick="sendMessage()">Send Message</button>
        <div class="result-box" id="contactResult" style="display:none;"></div>
    </div>

    <footer>
        <div class="container">
            <p style="text-align:center;">© 2024 Toolora. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function sendMessage() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            if (!name || !email || !message) {
                alert('Please fill all fields');
                return;
            }
            
            document.getElementById('contactResult').style.display = 'block';
            document.getElementById('contactResult').innerHTML = '✅ Thank you ' + name + '! Your message has been received.';
            
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('message').value = '';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
